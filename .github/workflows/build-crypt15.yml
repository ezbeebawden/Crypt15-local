
name: Build Crypt15 Local Test (ZIP source)

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract app source
        run: |
          mkdir -p crypt15-project
          unzip -q Crypt15-Local-Test-0.1.0-Source.zip -d crypt15-project

      - name: Build APK
        working-directory: crypt15-project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Crypt15-Local-Test-debug-APK
          path: crypt15-project/app/build/outputs/apk/debug/app-debug.apk
